<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#0f172a" rx="8"/>

  <!-- Title -->
  <text x="400" y="40" fill="#f8fafc" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">AGENT.md: The index.html for AI</text>

  <!-- Center Box: AGENT.md -->
  <rect x="250" y="80" width="300" height="320" fill="#1e293b" rx="8" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="110" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">&lt;AGENT.md&gt;</text>

  <!-- Head / Tier 1 -->
  <rect x="270" y="130" width="260" height="60" fill="#0f172a" rx="4" stroke="#475569" stroke-width="1"/>
  <text x="280" y="150" fill="#f472b6" font-family="monospace" font-size="12" font-weight="bold">&lt;head&gt; / Tier 1 (Loaded Always)</text>
  <text x="280" y="170" fill="#94a3b8" font-family="monospace" font-size="11">- Guardrails</text>
  <text x="280" y="185" fill="#94a3b8" font-family="monospace" font-size="11">- No leaking API keys</text>

  <!-- Body / Tier 2 -->
  <rect x="270" y="210" width="260" height="80" fill="#0f172a" rx="4" stroke="#475569" stroke-width="1"/>
  <text x="280" y="230" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="bold">&lt;body&gt; / Tier 2 (Lazy Loaded)</text>
  <text x="280" y="250" fill="#94a3b8" font-family="monospace" font-size="11">&lt;link href=".ai/database.mdc"&gt;</text>
  <text x="280" y="270" fill="#94a3b8" font-family="monospace" font-size="11">&lt;link href=".ai/frontend.mdc"&gt;</text>

  <!-- Script / Tier 3 -->
  <rect x="270" y="310" width="260" height="70" fill="#0f172a" rx="4" stroke="#475569" stroke-width="1"/>
  <text x="280" y="330" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">&lt;script&gt; / Tier 3 (Dynamic)</text>
  <text x="280" y="350" fill="#94a3b8" font-family="monospace" font-size="11">Connect to MCP Server (State)</text>
  <text x="280" y="365" fill="#94a3b8" font-family="monospace" font-size="11">Connect to MCP Tools (fzfast)</text>

  <!-- External Nodes -->
  <!-- Right side: Markdown files -->
  <rect x="620" y="200" width="140" height="40" fill="#334155" rx="4"/>
  <text x="690" y="225" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">.ai/database.mdc</text>

  <rect x="620" y="250" width="140" height="40" fill="#334155" rx="4"/>
  <text x="690" y="275" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">.ai/frontend.mdc</text>

  <!-- Arrows to Markdown -->
  <path d="M 530 235 L 610 220" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M 530 260 L 610 270" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>

  <!-- Left side: MCP -->
  <rect x="40" y="325" width="150" height="40" fill="#064e3b" rx="4" stroke="#10b981" stroke-width="1"/>
  <text x="115" y="350" fill="#6ee7b7" font-family="monospace" font-size="12" text-anchor="middle">Local MCP Server</text>

  <!-- Arrow to MCP -->
  <path d="M 270 345 L 200 345" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <!-- Definitions -->
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>
</svg>
