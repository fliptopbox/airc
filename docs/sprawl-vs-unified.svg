<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="800" height="400" fill="#0f172a" rx="8"/>
  
  <!-- Title -->
  <text x="400" y="40" fill="#f8fafc" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">Configuration Sprawl vs. Unified Harness</text>

  <!-- LEFT SIDE: BEFORE -->
  <rect x="40" y="70" width="320" height="300" fill="#1e293b" rx="8" stroke="#ef4444" stroke-width="2"/>
  <text x="200" y="100" fill="#ef4444" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">BEFORE (Sprawl)</text>

  <!-- AI Tools Left -->
  <rect x="60" y="130" width="100" height="40" fill="#334155" rx="4"/>
  <text x="110" y="155" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">Cursor</text>
  
  <rect x="60" y="200" width="100" height="40" fill="#334155" rx="4"/>
  <text x="110" y="225" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">Copilot</text>
  
  <rect x="60" y="270" width="100" height="40" fill="#334155" rx="4"/>
  <text x="110" y="295" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">Claude</text>

  <!-- Arrows Left -->
  <path d="M 170 150 L 220 150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 170 220 L 220 220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 170 290 L 220 290" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Config Files Left -->
  <rect x="230" y="130" width="110" height="40" fill="#450a0a" rx="4" stroke="#f87171" stroke-width="1"/>
  <text x="285" y="155" fill="#fca5a5" font-family="monospace" font-size="12" text-anchor="middle">.cursorrules</text>
  
  <rect x="230" y="200" width="110" height="40" fill="#450a0a" rx="4" stroke="#f87171" stroke-width="1"/>
  <text x="285" y="225" fill="#fca5a5" font-family="monospace" font-size="12" text-anchor="middle">copilot.md</text>
  
  <rect x="230" y="270" width="110" height="40" fill="#450a0a" rx="4" stroke="#f87171" stroke-width="1"/>
  <text x="285" y="295" fill="#fca5a5" font-family="monospace" font-size="12" text-anchor="middle">claude.json</text>

  <!-- RIGHT SIDE: AFTER -->
  <rect x="440" y="70" width="320" height="300" fill="#1e293b" rx="8" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="100" fill="#10b981" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">AFTER (Unified)</text>

  <!-- AI Tools Right -->
  <rect x="460" y="130" width="80" height="40" fill="#334155" rx="4"/>
  <text x="500" y="155" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">Cursor</text>
  
  <rect x="460" y="200" width="80" height="40" fill="#334155" rx="4"/>
  <text x="500" y="225" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">Copilot</text>
  
  <rect x="460" y="270" width="80" height="40" fill="#334155" rx="4"/>
  <text x="500" y="295" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">Claude</text>

  <!-- Converging Arrows -->
  <path d="M 550 150 L 590 190" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 550 220 L 590 220" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 550 290 L 590 250" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <!-- AGENT.md -->
  <rect x="600" y="190" width="140" height="60" fill="#064e3b" rx="6" stroke="#34d399" stroke-width="2"/>
  <text x="670" y="215" fill="#6ee7b7" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">AGENT.md</text>
  <text x="670" y="235" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">(The Router)</text>

  <!-- Definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>
</svg>
